name: "Build Docker Image"
description: "Build Docker image and push to ECR and optionally Docker Hub"

inputs:
  image_name:
    description: "Name of the image to build"
    required: true
  dockerfile:
    description: "Dockerfile to build"
    required: true
  context:
    description: "Context to build"
    required: true
    default: .
  suffix:
    description: "Suffix to add to the tag"
    required: false
    default: ""
  aws_role:
    description: "AWS role to assume"
    required: true
  build_args:
    description: "Additional Docker build args (newline-delimited KEY=VALUE entries)"
    required: false
    default: ""
  dockerhub_username:
    description: "Docker Hub username (optional - if provided, will also push to Docker Hub)"
    required: false
    default: ""
  dockerhub_token:
    description: "Docker Hub token (optional)"
    required: false
    default: ""
  dockerhub_repo:
    description: "Docker Hub repository (optional, defaults to softmax-inc/<image_name>)"
    required: false
    default: ""

outputs:
  tag:
    description: "Tag of the built Docker image"
    value: ${{ steps.meta.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Login to Docker Hub
      if: ${{ inputs.dockerhub_username != '' && inputs.dockerhub_token != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Compute image list
      id: images
      shell: bash
      run: |
        ECR_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }}"
        IMAGES="$ECR_IMAGE"

        # Add Docker Hub if credentials provided
        if [ -n "${{ inputs.dockerhub_username }}" ] && [ -n "${{ inputs.dockerhub_token }}" ]; then
          if [ -n "${{ inputs.dockerhub_repo }}" ]; then
            DOCKERHUB_IMAGE="${{ inputs.dockerhub_repo }}"
          else
            DOCKERHUB_IMAGE="softmax-inc/${{ inputs.image_name }}"
          fi
          IMAGES="$ECR_IMAGE"$'\n'"$DOCKERHUB_IMAGE"
        fi

        # Use heredoc for multiline output
        {
          echo "list<<EOF"
          echo "$IMAGES"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.images.outputs.list }}
        tags: |
          type=sha,format=long,priority=1000,suffix=${{ inputs.suffix }}
          type=sha,priority=999,suffix=${{ inputs.suffix }}
          type=raw,value=latest${{ inputs.suffix }},enable={{is_default_branch}}

    - name: Set up Docker Buildx
      uses: useblacksmith/setup-docker-builder@v1

    - name: Build and push Docker image
      id: push
      uses: useblacksmith/build-push-action@v2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }}:buildcache
        cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }}:buildcache,mode=max
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          GIT_COMMIT=${{ github.sha }}
          ${{ inputs.build_args }}
