name: "Episode Runner Compat"
description: "Run episode-runner compatibility test against the current compat-version image"

inputs:
  github-actor:
    description: "GitHub actor for GHCR login"
    required: true
  github-token:
    description: "GitHub token for GHCR login"
    required: true
  image:
    description: "Episode runner image override (defaults to compat-v from COMPAT_VERSION)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Environment
      uses: ./.github/actions/setup-environment
      with:
        install-mode: "testing"

    - name: Resolve episode-runner image
      id: image
      shell: bash
      run: |
        if [[ -n "${{ inputs.image }}" ]]; then
          IMAGE="${{ inputs.image }}"
        else
          COMPAT_VERSION=$(tr -d '[:space:]' < COMPAT_VERSION)
          IMAGE="ghcr.io/metta-ai/episode-runner:compat-v${COMPAT_VERSION}"
        fi

        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
        echo "Using image: ${IMAGE}"

    - name: Mount image cache
      uses: useblacksmith/stickydisk@v1
      with:
        key: episode-runner-image-${{ github.repository }}
        path: /tmp/episode-runner-cache

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.github-actor }}
        password: ${{ inputs.github-token }}

    - name: Load or pull episode-runner image
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
      run: |
        CACHE_DIR="/tmp/episode-runner-cache"
        CACHE_FILE="$CACHE_DIR/episode-runner.tar"
        DIGEST_FILE="$CACHE_DIR/digest"

        # Get remote digest without pulling
        REMOTE_DIGEST=$(docker manifest inspect --verbose "$IMAGE" 2>/dev/null | jq -r 'if type == "array" then .[] | select(.Descriptor.platform.architecture == "amd64") | .Descriptor.digest else .Descriptor.digest end' || echo "unknown")

        # Check if cache is current
        if [ -f "$CACHE_FILE" ] && [ -f "$DIGEST_FILE" ] && [ "$(cat "$DIGEST_FILE")" = "$REMOTE_DIGEST" ]; then
          echo "Loading cached image (digest matches)"
          docker load -i "$CACHE_FILE"
        else
          echo "Pulling fresh image (cache miss or stale)"
          docker pull --platform linux/amd64 "$IMAGE"
          PULLED_DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)
          mkdir -p "$CACHE_DIR"
          docker save "$IMAGE" -o "$CACHE_FILE"
          echo "${PULLED_DIGEST:-$REMOTE_DIGEST}" > "$DIGEST_FILE"
        fi

    - name: Run compat test
      shell: bash
      env:
        EPISODE_RUNNER_IMAGE: ${{ steps.image.outputs.image }}
      run: uv run pytest packages/cogames/tests/test_episode_runner_compat.py -v --timeout=300
