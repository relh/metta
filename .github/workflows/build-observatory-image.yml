name: "Build Observatory Frontend Docker Image"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    uses: ./.github/workflows/_build-and-deploy.yml
    secrets: inherit
    with:
      code_paths: |
        - 'web/observatory/**'
      image_name: metta-app-frontend
      dockerfile: web/observatory/Dockerfile
      namespace: observatory
      release: observatory
      chart: ./devops/charts/observatory
      production_helm_values: |
        --set datadog.env=production
      preview_helm_values: |
        --set host=${{ (github.event_name == 'pull_request' && github.event.action != 'closed') && format('observatory-preview-{0}.softmax-research.net', github.event.pull_request.number) || '' }} \
        --set resources.requests.cpu=100m \
        --set resources.requests.memory=64Mi \
        --set resources.limits.cpu=1000m \
        --set resources.limits.memory=512Mi \
        --set replicaCount=1
        --set datadog.env=preview
      preview_host: "${{ (github.event_name == 'pull_request' && github.event.action != 'closed') && format('observatory-preview-{0}.softmax-research.net', github.event.pull_request.number) || '' }}"
