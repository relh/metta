name: Auto-dispatch cortexcore publish

on:
  push:
    branches: [main]
    paths:
      - packages/cortex/pyproject.toml
      - uv.lock

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect bump-only cortexcore change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          RANGE="${{ github.event.before }}..${{ github.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "$RANGE")

          echo "Changed files in push range ($RANGE):"
          printf '  %s\n' "${CHANGED[@]}"

          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_PYPROJECT=no
          HAS_UVLOCK=no
          for f in "${CHANGED[@]}"; do
            case "$f" in
              packages/cortex/pyproject.toml)
                HAS_PYPROJECT=yes
                ;;
              uv.lock)
                HAS_UVLOCK=yes
                ;;
              *)
                echo "Non-version file changed: $f"
                echo "publish=no" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          if [[ "$HAS_PYPROJECT" != "yes" || "$HAS_UVLOCK" != "yes" ]]; then
            echo "Both packages/cortex/pyproject.toml and uv.lock must change."
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t PYPROJECT_LINES < <(git diff --unified=0 "$RANGE" -- packages/cortex/pyproject.toml | grep -E '^[+-]' | grep -Ev '^\+\+\+|^---' || true)
          if [[ ${#PYPROJECT_LINES[@]} -ne 2 ]]; then
            echo "Unexpected pyproject line-level changes:"
            printf '  %s\n' "${PYPROJECT_LINES[@]}"
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for line in "${PYPROJECT_LINES[@]}"; do
            if ! [[ "$line" =~ ^[+-]version\ =\ \"[0-9]+\.[0-9]+\.[0-9]+\"$ ]]; then
              echo "Non-version line edited in pyproject: $line"
              echo "publish=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          mapfile -t UVLOCK_LINES < <(git diff --unified=0 "$RANGE" -- uv.lock | grep -E '^[+-]' | grep -Ev '^\+\+\+|^---' || true)
          if [[ ${#UVLOCK_LINES[@]} -ne 2 ]]; then
            echo "Unexpected uv.lock line-level changes:"
            printf '  %s\n' "${UVLOCK_LINES[@]}"
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for line in "${UVLOCK_LINES[@]}"; do
            if ! [[ "$line" =~ ^[+-]version\ =\ \"[0-9]+\.[0-9]+\.[0-9]+\"$ ]]; then
              echo "Non-version line edited in uv.lock: $line"
              echo "publish=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if ! printf '%s\n' "${PYPROJECT_LINES[@]}" | grep -Eq '^[+-]version = "[0-9]+\.[0-9]+\.[0-9]+"$'; then
            echo "No valid cortex version line change detected in pyproject."
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(python -c "import pathlib,re; p=pathlib.Path('packages/cortex/pyproject.toml').read_text(); u=pathlib.Path('uv.lock').read_text(); mp=re.search(r'(?m)^version = \\\"(\\\\d+\\\\.\\\\d+\\\\.\\\\d+)\\\"$', p); mu=re.search(r'\\[\\[package\\]\\]\\\\nname = \\\"cortexcore\\\"\\\\nversion = \\\"(\\\\d+\\\\.\\\\d+\\\\.\\\\d+)\\\"', u); print(mp.group(1) if (mp and mu and mp.group(1)==mu.group(1)) else '')")

          if [[ -z "$VERSION" ]]; then
            echo "Version mismatch or missing cortexcore version metadata."
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=yes" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch release-cortexcore.yml on main
        if: steps.detect.outputs.publish == 'yes'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-cortexcore.yml',
              ref: 'main',
              inputs: {
                publish: 'yes',
                target: 'pypi',
              },
            });

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.detect.outputs.publish }}" == "yes" ]]; then
            echo "Auto-dispatched cortexcore publish for version ${{ steps.detect.outputs.version }}"
          else
            echo "No dispatch performed"
          fi
