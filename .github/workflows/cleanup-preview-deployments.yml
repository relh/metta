name: "Cleanup Stale Preview Deployments"

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  cleanup-previews:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read

    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Configure EKS
        uses: ./.github/actions/eks-configure
        with:
          aws_role: ${{ vars.AWS_ROLE }}

      - name: Cleanup stale preview deployments
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: 5
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          MAX_AGE_SECONDS=$((MAX_AGE_DAYS * 24 * 60 * 60))

          RELEASES=$(helm list -A -l pr-preview=true -o json | jq -c '.[]')
          if [[ -z "$RELEASES" ]]; then
            echo "No preview releases found"
            exit 0
          fi

          while read -r release_json; do
            NAMESPACE=$(echo "$release_json" | jq -r '.namespace')
            RELEASE=$(echo "$release_json" | jq -r '.name')
            UPDATED=$(echo "$release_json" | jq -r '.updated')

            # Extract PR number from release name (e.g. "observatory-pr-7030" -> "7030")
            PR_NUM=$(echo "$RELEASE" | grep -oP 'pr-\K[0-9]+' || true)

            # Helm updated format: "2026-02-15 12:34:56.123456789 +0000 UTC"
            # Strip trailing " UTC" and fractional seconds so GNU date can parse it
            CLEAN_DATE=$(echo "$UPDATED" | sed 's/ UTC$//' | sed 's/\.[0-9]* / /')
            UPDATED_TS=$(date -d "$CLEAN_DATE" +%s)
            AGE_SECONDS=$((NOW - UPDATED_TS))
            AGE_DAYS=$((AGE_SECONDS / 86400))

            if [[ $AGE_SECONDS -gt $MAX_AGE_SECONDS ]]; then
              echo "Deleting old preview: $RELEASE in $NAMESPACE (${AGE_DAYS} days old, PR #${PR_NUM:-unknown})"
              helm delete -n "$NAMESPACE" "$RELEASE" --ignore-not-found
              continue
            fi

            if [[ -z "$PR_NUM" ]]; then
              echo "ERROR: Could not extract PR number from release name '$RELEASE'"
              exit 1
            fi

            STATE=$(gh pr view "$PR_NUM" --json state -q '.state')

            if [[ "$STATE" != "OPEN" ]]; then
              echo "Deleting stale preview: $RELEASE in $NAMESPACE (PR #$PR_NUM is $STATE)"
              helm delete -n "$NAMESPACE" "$RELEASE" --ignore-not-found
            else
              echo "Keeping preview: $RELEASE in $NAMESPACE (PR #$PR_NUM is still open, ${AGE_DAYS} days old)"
            fi
          done <<< "$RELEASES"
