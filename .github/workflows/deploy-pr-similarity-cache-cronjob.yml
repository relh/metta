name: "Deploy PR Similarity Cache CronJob"

on:
  push:
    branches:
      - main
    paths:
      - "mcp_servers/pr_similarity/**"
      - "packages/gitta/**"
      - "devops/charts/cronjob/**"
      - ".github/workflows/deploy-pr-similarity-cache-cronjob.yml"
  workflow_dispatch: {}

jobs:
  build-and-push-image:
    permissions:
      id-token: write
      contents: read

    uses: ./.github/workflows/_build-and-deploy.yml
    with:
      image_name: metta-cronjobs
      tag_suffix: "-pr-similarity"
      dockerfile: ./devops/charts/cronjob/Dockerfile.pr-similarity
      namespace: monitoring
      release: pr-similarity-cache-cronjob
      chart: ./devops/charts/cronjob
