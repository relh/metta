name: "Stable Release CLI Health"

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: stable-release-cli-health
  cancel-in-progress: false

jobs:
  stable-release-cli-health:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_stable-release-run.yml
    secrets: inherit
    with:
      check_groups: cli_health
      logs_artifact_name: runner-logs-cli-health
