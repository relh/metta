name: "Build Episode Runner Image"

on:
  workflow_run:
    workflows: ["Build and publish cogames"]
    types: [completed]
  workflow_dispatch:
    inputs:
      cogames_version:
        description: "cogames version to install (e.g. 0.1.0). Leave empty to use latest from PyPI."
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: metta-ai/episode-runner

jobs:
  resolve-version:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      cogames_version: ${{ steps.version.outputs.cogames_version }}
    steps:
      - name: Resolve cogames version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.cogames_version }}" ]]; then
            VERSION="${{ inputs.cogames_version }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Resolve the tag from the triggering workflow run's commit.
            # Querying PyPI here is racy — the new version may not be indexed yet.
            TRIGGER_SHA="${{ github.event.workflow_run.head_sha }}"
            VERSION=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq \
              ".[] | select(.commit.sha == \"$TRIGGER_SHA\") | .name" | grep '^cogames-v' | head -1)
            if [[ -z "$VERSION" ]]; then
              echo "::warning::No cogames-v* tag found on trigger commit $TRIGGER_SHA, falling back to PyPI"
              VERSION=$(curl -s https://pypi.org/pypi/cogames/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
            fi
          else
            VERSION=$(curl -s https://pypi.org/pypi/cogames/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          fi
          VERSION="${VERSION#cogames-v}"
          VERSION="${VERSION#v}"
          echo "cogames_version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Compute tags
        id: tags
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.resolve-version.outputs.cogames_version }}"
          COMPAT=$(echo "$VERSION" | cut -d. -f1-2)
          TAGS="${REPO}:cogames-${VERSION},${REPO}:compat-v${COMPAT},${REPO}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Wait for cogames on PyPI
        env:
          VERSION: ${{ needs.resolve-version.outputs.cogames_version }}
        run: |
          MAX_WAIT=2400
          CHECK_INTERVAL=30
          ELAPSED=0
          echo "Waiting for cogames==${VERSION} on PyPI..."
          while [ $ELAPSED -le $MAX_WAIT ]; do
            if curl -sf "https://pypi.org/pypi/cogames/${VERSION}/json" > /dev/null 2>&1; then
              echo "cogames ${VERSION} is available on PyPI!"
              exit 0
            fi
            echo "Waiting... ($ELAPSED/$MAX_WAIT seconds elapsed)"
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done
          echo "ERROR: cogames ${VERSION} not found on PyPI after ${MAX_WAIT} seconds"
          exit 1

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./packages/cogames/Dockerfile.episode_runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COGAMES_VERSION=${{ needs.resolve-version.outputs.cogames_version }}
            GIT_COMMIT=${{ github.sha }}

  notify-discord:
    name: Notify Discord
    needs: [resolve-version, build-and-push]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/notify-discord-status
      - uses: ./.github/actions/notify-discord-status
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          package-name: episode-runner
          version: ${{ needs.resolve-version.outputs.cogames_version }}
          success-message: "✅ **episode-runner** image built and pushed: `ghcr.io/metta-ai/episode-runner:cogames-${{ needs.resolve-version.outputs.cogames_version }}`"
          needs-context: ${{ toJSON(needs) }}
