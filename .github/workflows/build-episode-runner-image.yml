name: "Build Episode Runner Image"

on:
  workflow_run:
    workflows: ["Build and publish cogames"]
    types: [completed]
  workflow_dispatch:
    inputs:
      cogames_version:
        description: "cogames version to install (e.g. 0.1.0). Leave empty to use latest from PyPI."
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: metta-ai/episode-runner

jobs:
  resolve-version:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      cogames_version: ${{ steps.version.outputs.cogames_version }}
    steps:
      - name: Resolve cogames version
        id: version
        run: |
          if [[ -n "${{ inputs.cogames_version }}" ]]; then
            VERSION="${{ inputs.cogames_version }}"
          else
            VERSION=$(curl -s https://pypi.org/pypi/cogames/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")
          fi
          VERSION="${VERSION#cogames-v}"
          VERSION="${VERSION#v}"
          echo "cogames_version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Compute tags
        id: tags
        run: |
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.resolve-version.outputs.cogames_version }}"
          TAGS="${REPO}:cogames-${VERSION},${REPO}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./packages/cogames/Dockerfile.episode_runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COGAMES_VERSION=${{ needs.resolve-version.outputs.cogames_version }}
            GIT_COMMIT=${{ github.sha }}

  notify-discord:
    name: Notify Discord on success
    needs: [resolve-version, build-and-push]
    if: success()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.resolve-version.outputs.cogames_version }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No Discord webhook URL configured, skipping"
            exit 0
          fi
          if [ -z "$VERSION" ]; then
            echo "No version found, skipping"
            exit 0
          fi
          IMAGE="ghcr.io/metta-ai/episode-runner:cogames-${VERSION}"
          MSG="✅ **episode-runner** image built and pushed: \`${IMAGE}\`"
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": $(echo "$MSG" | jq -Rs .), \"flags\": 4}"
