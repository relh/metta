name: "Test and Benchmark"

# This workflow uses metta ci as the single source of truth for CI checks.
# Each job calls metta ci with a specific stage:
#   metta ci lint, metta ci python-tests,
#   metta ci cpp-tests, metta ci cpp-benchmarks, metta ci nim-tests, metta ci recipe-tests, metta ci cogames-docsync
# Local development can run all stages with: metta ci

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_test:
        description: "Run tests"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Set default permissions
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  # check if any source code files have changed, and if Graphite wants to skip the checks
  setup-checks:
    name: "Set up for source code checks"
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      skip: ${{ steps.graphite_ci.outputs.skip || 'false' }}
      has_relevant_changes: ${{ steps.filter.outputs.py_files || 'false' }}
      app_backend_has_changes: ${{ steps.filter.outputs.app_backend_files || 'false' }}
      cogames_docs_changed: ${{ steps.filter.outputs.cogames_docs || 'false' }}
      compat_sources_changed: ${{ steps.filter.outputs.compat_sources || 'false' }}
      compat_version_changed: ${{ steps.filter.outputs.compat_version || 'false' }}
      run_test: ${{ steps.determine_tasks.outputs.run_test || 'false' }}
      is_external: ${{ steps.detect-pr.outputs.is_external || 'true' }}
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Detect PR context
        id: detect-pr
        uses: ./.github/actions/detect-external-pr

      - name: Graphite CI Optimizer
        id: graphite_ci
        if: steps.detect-pr.outputs.is_external != 'true'
        uses: withgraphite/graphite-ci-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}

      - name: Check for file changes
        if: steps.graphite_ci.outputs.skip != 'true'
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            py_files:
              - '**/*.py'
              - '**/*.cpp'
              - '**/*.hpp'
              - '**/*.toml'
              - '**/conftest.py'
              - '**/pyproject.toml'
              - '**/pytest.ini'
              - 'uv.lock'
              - 'README.md'
              - '**/BUILD'
              - '**/BUILD.bazel'
              - '**/*.bzl'
              - '**/MODULE.bazel'
              - '**/.bazelrc'
              - '.bazelversion'
            app_backend_files:
              - 'app_backend/**'
            cogames_docs:
              - 'packages/cogames/**/*.py'
              - 'packages/cogames/**/*.ipynb'
              - 'packages/cogames/**/*.md'
            compat_sources:
              - 'packages/cogames/**'
              - 'packages/mettagrid/**'
            compat_version:
              - 'COMPAT_VERSION'

      - name: Determine which tasks to run
        if: steps.graphite_ci.outputs.skip != 'true'
        id: determine_tasks
        run: |
          # Default behavior based on event type and file changes
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Use workflow dispatch inputs for manual runs
            RUN_TEST="${{ github.event.inputs.run_test }}"
          elif [[ "${{ steps.filter.outputs.py_files }}" == "false" ]]; then
            # Skip everything when no relevant files changed (PRs, merge queue, pushes)
            RUN_TEST="false"
            echo "::notice title=Skipping Tasks::Skipping all tasks because no relevant files have changed"
          else
            # Default to running everything for other events or when changes exist
            RUN_TEST="true"
          fi

          # Output the decisions
          echo "run_test=${RUN_TEST}" >> $GITHUB_OUTPUT

          echo "run test? ${RUN_TEST}"

  lint:
    name: "Lint"
    needs: setup-checks
    if: needs.setup-checks.outputs.skip == 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-mode: "testing"
          pnpm: "true"

      - name: Run linting and formatting
        run: metta ci lint

  python-tests:
    name: "Tests - Python"
    needs: setup-checks
    if: |
      needs.setup-checks.outputs.skip == 'false' &&
      needs.setup-checks.outputs.run_test == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          pnpm: "true"

      - name: Configure Datadog
        if: needs.setup-checks.outputs.is_external != 'true'
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}

      - name: Pre-pull Docker images for tests
        if: needs.setup-checks.outputs.app_backend_has_changes == 'true'
        run: docker pull postgres:17

      - name: Run Python tests
        shell: bash
        env:
          DD_CIVISIBILITY_LOG_LEVEL: warning
          EPISODE_RUNNER_USE_ISOLATED_VENVS: "0"
        run: |
          set -eo pipefail
          ARGS=()
          if [[ "${{ needs.setup-checks.outputs.app_backend_has_changes }}" != "true" ]]; then
            ARGS+=(--skip-package app_backend)
          fi
          metta ci python-tests "${ARGS[@]}"

  recipe-tests:
    name: "Tests - Recipes (Smoke)"
    needs: setup-checks
    if: |
      needs.setup-checks.outputs.skip == 'false' &&
      needs.setup-checks.outputs.run_test == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-mode: "runtime"

      - name: Run recipe smoke test
        run: metta ci recipe-tests

  cpp-tests:
    name: "Tests - C++ and Nim"
    needs: setup-checks
    if: |
      needs.setup-checks.outputs.skip == 'false' &&
      needs.setup-checks.outputs.run_test == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-mode: "testing"

      - name: Run C++ tests
        run: metta ci cpp-tests

      - name: Run C++ benchmarks
        run: metta ci cpp-benchmarks

      - name: Run Nim tests
        run: metta ci nim-tests

  cogames-docsync:
    name: "CoGames Docs Sync"
    needs: setup-checks
    if: |
      needs.setup-checks.outputs.skip == 'false' &&
      needs.setup-checks.outputs.cogames_docs_changed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Since we're running arbitrary code in the notebooks, it's good to have a timeout.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-mode: "testing"
          pnpm: "true"

      - name: Check cogames docs sync
        run: metta ci cogames-docsync

  episode-runner-compat:
    name: "Episode Runner Compat"
    needs: setup-checks
    if: |
      needs.setup-checks.outputs.skip == 'false' &&
      needs.setup-checks.outputs.compat_sources_changed == 'true' &&
      needs.setup-checks.outputs.compat_version_changed != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Run episode-runner compat check
        uses: ./.github/actions/episode-runner-compat
        with:
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Single status check for branch protection rule
  tests-summary:
    name: "Tests"
    needs: [python-tests, cpp-tests, recipe-tests, lint, cogames-docsync, episode-runner-compat]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check unit tests did not fail
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const results = Object.values(needs).map(j => j.result || '').join(',');
            core.info(`Test job results: ${results}`);

            if (results.includes('failure')) {
              core.setFailed('One or more test jobs failed');     // red
              return;
            }
            if (results.includes('cancelled')) {
              core.notice('One or more test jobs were cancelled');
            } else {
              core.info('All test jobs completed successfully');
            }
