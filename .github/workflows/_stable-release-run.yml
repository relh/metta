name: Stable Release Runner

on:
  workflow_call:
    inputs:
      check_groups:
        description: "Optional comma-separated check groups, e.g. live_tests_light,live_tests_heavy"
        required: false
        type: string
        default: ""
      logs_artifact_name:
        description: "Artifact name for uploaded logs"
        required: false
        type: string
        default: runner-logs

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  stable-release:
    runs-on: ubuntu-8core

    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}
          fetch-depth: 0 # Full history needed for git operations

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-mode: testing

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Weights & Biases credentials
        run: |
          echo "machine api.wandb.ai" > $HOME/.netrc
          echo "login user" >> $HOME/.netrc
          echo "password ${{ secrets.WANDB_API_KEY }}" >> $HOME/.netrc
          chmod 600 $HOME/.netrc
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

      - name: Set up Observatory credentials
        run: |
          mkdir -p $HOME/.metta
          echo "${{ secrets.STABLE_RELEASE_SERVICE_TOKEN }}" > $HOME/.metta/observatory_token

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: us-east-1
          role-duration-seconds: 36000

      - name: Configure SkyPilot API server
        run: |
          sky api login -e https://skypilot-api.softmax-research.net --token ${{ secrets.SKYPILOT_SERVICE_ACCOUNT_TOKEN }}

      - name: Check and stash uncommitted changes
        run: |
          echo "Checking git status before stable release..."
          git status

          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "Found uncommitted changes. Stashing them to ensure clean state for remote jobs..."
            git stash push -m "GitHub Actions: Auto-stash before stable release"
            echo "Changes stashed successfully"
          else
            echo "Working tree is clean"
          fi

      - name: Run stable release process
        id: release
        shell: bash
        run: |
          mkdir -p devops/stable/state/logs

          export STABLE_CHECK_GROUPS="${{ inputs.check_groups }}"

          set +e
          python - <<'PY' > devops/stable/state/logs/stable_release_process.log 2>&1
          import os
          import shlex
          import subprocess
          import sys

          cmd = ["python", "-u", "./devops/stable/stable_check_cli.py"]
          raw_groups = os.environ.get("STABLE_CHECK_GROUPS", "")
          for group in raw_groups.split(","):
              group = group.strip()
              if group:
                  cmd.extend(["--check-group", group])

          print(f"stable_check_cli command: {shlex.join(cmd)}", flush=True)
          proc = subprocess.run(cmd)
          print(f"stable_check_cli exit code: {proc.returncode}", flush=True)
          sys.exit(proc.returncode)
          PY
          release_exit_code=$?
          set -e
          cat devops/stable/state/logs/stable_release_process.log

          if [ "$release_exit_code" -ne 0 ] && [ ! -f devops/stable/state/discord_summary.txt ]; then
            mkdir -p devops/stable/state
            {
              echo "Stable release failed before summary generation."
              echo ""
              echo "Check groups: ${{ inputs.check_groups }}"
              echo "Exit code: ${release_exit_code}"
              echo ""
              echo "Tail of stable release output:"
              if [ -f devops/stable/state/logs/stable_release_process.log ]; then
                tail -n 50 devops/stable/state/logs/stable_release_process.log
              else
                echo "<stable_release_process.log missing>"
              fi
            } > devops/stable/state/discord_summary.txt
          fi

          exit $release_exit_code
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          STABLE_RELEASE_SERVICE_TOKEN: ${{ secrets.STABLE_RELEASE_SERVICE_TOKEN }}
          SKYPILOT_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SKYPILOT_SERVICE_ACCOUNT_TOKEN }}
          # Note: GITHUB_TOKEN expires after 24h. If a SkyPilot job restarts after expiry,
          # the setup phase (which downloads setup.sh via curl) will fail. For now this is acceptable.
          # because stable-release checks should finish on the order of single-digit hours
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord notification
        if: always()
        uses: ./.github/actions/discord-webhook
        with:
          webhook-url: ${{ github.ref == 'refs/heads/main' && secrets.DISCORD_STABLE_HOOK || secrets.DISCORD_INFRA_ALERTS_TESTING_HOOK }}
          content-file: devops/stable/state/discord_summary.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.logs_artifact_name }}
          path: devops/stable/state/logs/
          retention-days: 30
