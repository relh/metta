name: Auto-approve cogames mettagrid version bumps

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "packages/cogames/pyproject.toml"

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR only bumps mettagrid version
        id: check
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          # Check 1: Only one file changed and it's packages/cogames/pyproject.toml
          FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          if [ "$FILES" != "packages/cogames/pyproject.toml" ]; then
            echo "PR touches files other than packages/cogames/pyproject.toml"
            echo "should_approve=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check 2: Diff only touches mettagrid version line
          DIFF=$(gh pr diff "$PR_NUMBER")

          # Extract only the +/- lines (actual changes, not context)
          CHANGED_LINES=$(echo "$DIFF" | grep -E '^[+-]' | grep -Ev '^[+-]{3}' || true)

          # Check that all changed lines are mettagrid version changes
          VALID=true
          while IFS= read -r line; do
            # Skip empty lines
            [ -z "$line" ] && continue
            # Each changed line must match the mettagrid dependency pattern
            if ! echo "$line" | grep -qE '^[+-][[:space:]]+"mettagrid==[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?",?$'; then
              echo "Found non-mettagrid change: $line"
              VALID=false
              break
            fi
          done <<< "$CHANGED_LINES"

          if [ "$VALID" = "true" ]; then
            echo "PR only bumps mettagrid version"
            echo "should_approve=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR contains changes other than mettagrid version bump"
            echo "should_approve=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve PR
        if: steps.check.outputs.should_approve == 'true'
        run: gh pr review ${{ github.event.pull_request.number }} --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
