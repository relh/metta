name: "Deploy Vibeservatory"

on:
  push:
    branches:
      - main
    paths:
      - "vibeservatory/backend/**"
      - "chatprop/**"
      - "trainboard/**"
      - "app_backend/**"
      - "common/**"
      - "packages/mettagrid/**"
      - "packages/cogames/**"
      - "packages/cogames-agents/**"
      - "devops/docker/Dockerfile.backend"
      - "devops/charts/vibeservatory/**"
      - ".github/workflows/deploy-vibeservatory.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    permissions:
      id-token: write
      contents: read

    uses: ./.github/workflows/_build-and-deploy.yml
    secrets: inherit
    with:
      image_name: metta-app-backend
      dockerfile: ./devops/docker/Dockerfile.backend
      tag_suffix: -vibeservatory
      namespace: observatory
      release: vibeservatory
      chart: ./devops/charts/vibeservatory
      production_helm_values: >-
        --set datadog.env=production
