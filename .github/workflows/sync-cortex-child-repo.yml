name: Sync cortex child repo

on:
  push:
    branches: [main]
    paths:
      - "packages/cortex/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-cortex-child-repo
  cancel-in-progress: true

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "::add-mask::${{ steps.ci-token.outputs.token }}"
          git config --global url."https://x-access-token:${{ steps.ci-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ steps.ci-token.outputs.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.ci-token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install git-filter-repo
        run: |
          if git filter-repo --version; then
            exit 0
          fi

          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/git-filter-repo" https://raw.githubusercontent.com/newren/git-filter-repo/main/git-filter-repo
          chmod +x "$HOME/.local/bin/git-filter-repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"
          git filter-repo --version

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install tomlkit

      - name: Sync cortex child repo
        env:
          PYTHONPATH: common/src:packages/gitta/src
        run: |
          ./devops/git/push_child_repo.py --target-branch main --use-https -y cortex
