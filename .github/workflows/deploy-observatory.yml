name: "Deploy Observatory"

on:
  push:
    branches:
      - main
    paths:
      - "app_backend/**"
      - "metta/sim/**"
      - "common/**"
      - "packages/mettagrid/**"
      - "packages/cogames/**"
      - "packages/cogames-agents/**"
      - "devops/docker/Dockerfile.backend"
      - "devops/charts/observatory-backend/**"
      - "devops/charts/orchestrator/**"
      - ".github/workflows/deploy-observatory.yml"
  workflow_dispatch: {}

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  build-and-deploy-backend:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_build-and-deploy.yml
    secrets: inherit
    with:
      image_name: metta-app-backend
      dockerfile: ./devops/docker/Dockerfile.backend
      namespace: observatory
      release: observatory-backend
      chart: ./devops/charts/observatory-backend

  deploy-orchestrator:
    name: "Deploy Orchestrator"
    needs: build-and-deploy-backend
    if: github.ref == 'refs/heads/main' && needs.build-and-deploy-backend.outputs.image_tag != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}
      - name: Configure EKS
        uses: ./.github/actions/eks-configure
        with:
          aws_role: ${{ vars.AWS_ROLE }}
      - name: Deploy orchestrator
        run: |
          helm upgrade \
            -n orchestrator \
            orchestrator \
            ./devops/charts/orchestrator \
            --reuse-values \
            --set image.tag=${{ needs.build-and-deploy-backend.outputs.image_tag }}

  notify-discord:
    name: Notify Discord
    needs: [build-and-deploy-backend, deploy-orchestrator]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/notify-discord-status
      - uses: ./.github/actions/notify-discord-status
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          package-name: observatory
          version: ${{ needs.build-and-deploy-backend.outputs.image_tag }}
          success-message: "observatory deployed: `${{ needs.build-and-deploy-backend.outputs.image_tag }}`"
          needs-context: ${{ toJSON(needs) }}
