name: Build and publish pufferlib-core

on:
  push:
    tags:
      - pufferlib-core-v*
  workflow_dispatch:
    inputs:
      publish:
        description: "Enable publishing step (builds will be created regardless)"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      target:
        description: "Where to publish: testpypi (safe testing) or pypi (live release)"
        required: false
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"
      - run: pipx run build --sdist --outdir dist packages/pufferlib-core
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels-linux:
    name: Build Linux wheels
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"

      - uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* *i686"
          CIBW_ARCHS_LINUX: auto
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: |-
            git config --global --add safe.directory /project
            dnf install -y dnf-plugins-core
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo
            dnf install -y cuda-toolkit-12-8
            ln -sfn /usr/local/cuda-12.8 /usr/local/cuda
            /usr/local/cuda/bin/nvcc --version
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME=/usr/local/cuda
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            TORCH_CUDA_ARCH_LIST='8.0;8.6;8.9;9.0+PTX'
            PUFFERLIB_BUILD_CUDA=1
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair {wheel} --wheel-dir {dest_dir}
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            --exclude libcudart.so.12
            --exclude libgomp.so.1
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          CI: "true"
        with:
          package-dir: packages/pufferlib-core
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-blacksmith-4vcpu-ubuntu-2404
          path: wheelhouse/*.whl

  build-wheels-macos:
    name: Build macOS wheels
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"

      - uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* *i686"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          CI: "true"
        with:
          package-dir: packages/pufferlib-core
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-14
          path: wheelhouse/*.whl

  verify-linux-wheels:
    name: Verify Linux CUDA wheel on Python ${{ matrix.python-version }}
    needs: build-wheels-linux
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            python-tag: cp311
          - python-version: "3.12"
            python-tag: cp312
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-blacksmith-4vcpu-ubuntu-2404
          path: dist

      - name: Install torch and built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.0
          WHEEL=$(ls dist/pufferlib_core-*-${{ matrix.python-tag }}-${{ matrix.python-tag }}-manylinux_2_34_x86_64.whl)
          python -m pip install --force-reinstall --no-deps "$WHEEL"

      - name: Verify CUDA kernel registration
        run: |
          python - <<'PY'
          import importlib.machinery
          import importlib.metadata
          import importlib.util
          import pathlib
          import sys
          import types

          import torch

          version = importlib.metadata.version("pufferlib-core")
          dist = importlib.metadata.distribution("pufferlib-core")
          extension_suffixes = tuple(importlib.machinery.EXTENSION_SUFFIXES)
          extension_relpath = next(
              path
              for path in dist.files or []
              if path.name.startswith("_C") and path.name.endswith(extension_suffixes)
          )
          extension_path = pathlib.Path(dist.locate_file(extension_relpath))
          package = types.ModuleType("pufferlib")
          package.__path__ = [str(extension_path.parent)]
          sys.modules["pufferlib"] = package
          spec = importlib.util.spec_from_file_location("pufferlib._C", extension_path)
          module = importlib.util.module_from_spec(spec)
          sys.modules["pufferlib._C"] = module
          spec.loader.exec_module(module)
          assert torch._C._dispatch_has_kernel_for_dispatch_key(
              "pufferlib::compute_puff_advantage",
              "CUDA",
          ), f"{version} wheel is missing CUDA dispatch registration"
          PY

  publish:
    needs: [build-sdist, build-wheels-linux, build-wheels-macos, verify-linux-wheels]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'yes' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist/

      - name: Check distributions
        run: pipx run twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.PUBLISH_TARGET == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: ${{ env.PUBLISH_TARGET == 'testpypi' }}
          verbose: true

  notify-discord:
    name: Notify Discord
    needs: [build-sdist, build-wheels-linux, build-wheels-macos, verify-linux-wheels, publish]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/notify-discord-status
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == pufferlib-core-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#pufferlib-core-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
          fi
      - uses: ./.github/actions/notify-discord-status
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          package-name: pufferlib-core
          version: ${{ steps.version.outputs.version }}
          success-message: "pufferlib-core v${{ steps.version.outputs.version }} published to [PyPI](https://pypi.org/project/pufferlib-core/${{ steps.version.outputs.version }}/)"
          needs-context: ${{ toJSON(needs) }}
