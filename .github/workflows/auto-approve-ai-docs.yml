name: Auto-approve AI docs and skills

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "docs/ai/**/*.md"
      - "docs/skills.md"
      - "skills/**/*.md"

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Check if PR only touches AI docs and skills
        id: check
        run: |
          mapfile -t FILES < <(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "all_match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ALL_MATCH=true
          for f in "${FILES[@]}"; do
            if [[ ! "$f" =~ ^(docs/ai/.*\.md|docs/skills\.md|skills/.*\.md)$ ]]; then
              ALL_MATCH=false
              break
            fi
          done
          echo "all_match=$ALL_MATCH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve PR
        if: steps.check.outputs.all_match == 'true'
        run: gh pr review ${{ github.event.pull_request.number }} --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
