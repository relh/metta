name: "Build and Deploy Mettascope & Vibescope"
on:
  push:
    paths: &site_paths
      - "packages/mettagrid/nim/mettascope/**"
      - "packages/mettagrid/nim/vibescope/**"
      - ".github/workflows/**"
  pull_request:
    paths: *site_paths
  workflow_dispatch: {}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Configure concurrency to always run
concurrency:
  group: pages-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-mode: "testing"

      - name: Cache nimby dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nimby
          key: nimby-deps-${{ hashFiles('metta/packages/mettagrid/nim/mettascope/nimby.lock', 'metta/packages/mettagrid/nim/vibescope/nimby.lock') }}-${{ runner.os }}

      - name: Clean cached nimby repos
        run: |
          if [ -d ~/.nimby/pkgs ]; then
            for repo in ~/.nimby/pkgs/*; do
              if [ -d "$repo/.git" ]; then
                git -C "$repo" reset --hard
                git -C "$repo" clean -fdx
              fi
            done
          fi

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.19
          actions-cache-folder: "emsdk-cache"

      # Build Mettascope first with its dependencies
      - name: Install Mettascope Dependencies
        run: |
          cd ..
          nimby sync -g metta/packages/mettagrid/nim/mettascope/nimby.lock

      - name: Build mettascope
        run: |
          mkdir -p packages/mettagrid/nim/mettascope/dist
          nim c -d:emscripten packages/mettagrid/nim/mettascope/src/mettascope.nim
          ls -la packages/mettagrid/nim/mettascope/dist

      # Then build Vibescope with its dependencies
      - name: Install Vibescope Dependencies
        run: |
          cd ..
          nimby sync -g metta/packages/mettagrid/nim/vibescope/nimby.lock

      - name: Build vibescope
        run: |
          mkdir -p packages/mettagrid/nim/vibescope/dist
          nim c -d:emscripten packages/mettagrid/nim/vibescope/src/vibescope.nim
          ls -la packages/mettagrid/nim/vibescope/dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create deployment directory
        run: |
          mkdir -p deploy/mettascope
          cp -r packages/mettagrid/nim/mettascope/dist/* deploy/mettascope/
          mkdir -p deploy/vibescope
          cp -r packages/mettagrid/nim/vibescope/dist/* deploy/vibescope/

      - name: Upload artifact
        # Only upload artifact for main branch
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./deploy"

      - name: Deploy to GitHub Pages
        # Only deploy for main branch
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
