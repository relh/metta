name: "Deploy Watcher"

on:
  push:
    branches:
      - main
    paths:
      - "app_backend/src/metta/app_backend/job_runner/watcher.py"
      - "devops/charts/orchestrator/templates/watcher-deployment.yaml"
      - ".github/workflows/deploy-watcher.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Leave empty to use sha-<HEAD>."
        required: false

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  build-and-deploy:
    name: "Build and Deploy Watcher"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Resolve image tag
        id: resolve-tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: ./.github/actions/docker-build
        with:
          image_name: metta-app-backend
          dockerfile: ./devops/docker/Dockerfile.backend
          aws_role: ${{ vars.AWS_ROLE }}

      - name: Configure EKS
        uses: ./.github/actions/eks-configure
        with:
          aws_role: ${{ vars.AWS_ROLE }}
      - name: Preflight release lock check
        uses: ./.github/actions/helm-preflight-lock-check
        with:
          namespace: orchestrator
          release: orchestrator

      - name: Deploy watcher
        run: |
          helm upgrade -i \
            --atomic --timeout 15m \
            -n orchestrator \
            orchestrator \
            ./devops/charts/orchestrator \
            --reuse-values \
            --set watcher.imageTag=${{ steps.resolve-tag.outputs.tag }}
      - name: Collect deploy failure diagnostics
        if: failure()
        uses: ./.github/actions/deploy-failure-diagnostics
        with:
          namespace: orchestrator
          release: orchestrator

  notify-discord:
    name: Notify Discord
    needs: [build-and-deploy]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/notify-discord-status
      - uses: ./.github/actions/notify-discord-status
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          package-name: watcher
          version: ${{ needs.build-and-deploy.outputs.image_tag }}
          success-message: "watcher deployed with image tag: `${{ needs.build-and-deploy.outputs.image_tag }}`"
          needs-context: ${{ toJSON(needs) }}
