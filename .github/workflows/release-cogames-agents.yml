name: Build and publish cogames-agents

on:
  push:
    tags:
      - cogames-agents-v*
  workflow_dispatch:
    inputs:
      publish:
        description: "Enable publishing step"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      target:
        description: "Where to publish: testpypi (safe testing) or pypi (live release)"
        required: false
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist --outdir dist packages/cogames-agents
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pypa/cibuildwheel@v3.2.0
        env:
          # cogames-agents requires >=3.12,<3.13
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux* *i686"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: auto
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          CIBW_BEFORE_ALL_LINUX: |
            ARCH="$(uname -m)"

            # Install nimby and use it to install Nim
            NIM_VERSION=$(cat {project}/.nim-version)
            NIMBY_VERSION=$(cat {project}/.nimby-version)
            if [ "$ARCH" = "aarch64" ]; then
              NIMBY_PLATFORM="Linux-ARM64"
            elif [ "$ARCH" = "x86_64" ]; then
              NIMBY_PLATFORM="Linux-X64"
            else
              echo "Unexpected architecture: $ARCH" && exit 1
            fi
            TMP_DIR="$(mktemp -d)"
            curl -fsSL -o "$TMP_DIR/nimby" \
              "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-${NIMBY_PLATFORM}"
            chmod +x "$TMP_DIR/nimby"
            "$TMP_DIR/nimby" use "$NIM_VERSION"
            install_dir="$HOME/.nimby/nim/bin"
            mkdir -p "$install_dir"
            mv -f "$TMP_DIR/nimby" "$install_dir/nimby"
            rm -rf "$TMP_DIR"
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.nimby/nim/bin:$PATH"
          CIBW_BEFORE_ALL_MACOS: |
            NIM_VERSION=$(cat {project}/.nim-version)
            NIMBY_VERSION=$(cat {project}/.nimby-version)
            ARCH="X64"
            if [ "$(uname -m)" = "arm64" ] || [ "$(uname -m)" = "aarch64" ]; then
              ARCH="ARM64"
            fi
            TMP_DIR="$(mktemp -d)"
            curl -sSfL -o "$TMP_DIR/nimby" "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/nimby-macOS-${ARCH}"
            chmod +x "$TMP_DIR/nimby"
            "$TMP_DIR/nimby" use "$NIM_VERSION"
            install_dir="$HOME/.nimby/nim/bin"
            mkdir -p "$install_dir"
            mv -f "$TMP_DIR/nimby" "$install_dir/nimby"
            rm -rf "$TMP_DIR"
          CIBW_ENVIRONMENT_MACOS: PATH="$HOME/.nimby/nim/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=11.0
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          CI: "true"
        with:
          package-dir: packages/cogames-agents
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  wait-for-mettagrid:
    uses: ./.github/workflows/_wait-for-pypi.yml
    with:
      pyproject-path: packages/cogames-agents/pyproject.toml
      dependency: mettagrid

  wait-for-cogames:
    uses: ./.github/workflows/_wait-for-pypi.yml
    with:
      pyproject-path: packages/cogames-agents/pyproject.toml
      dependency: cogames
      max-wait: 2400
      check-interval: 30

  test:
    name: Smoke test cogames-agents
    needs:
      - wait-for-mettagrid
      - wait-for-cogames
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Metta-AI/cogames-agents
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify checked out ref
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "Checked out: $(git describe --tags --always)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == cogames-agents-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#cogames-agents-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      - name: Install cogames-agents with test dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install ".[test]"
      - name: Run tests
        run: |
          pytest tests/ -v

  publish:
    name: Publish to PyPI
    needs:
      - build-sdist
      - build-wheels
      - wait-for-mettagrid
      - wait-for-cogames
      - test
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'yes' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ format('cogames-agents-{0}', github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi') }}
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi' }}
      DEPLOY_ENV: ${{ format('cogames-agents-{0}', github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi') }}
      DEPLOY_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/project/cogames-agents/' || 'https://pypi.org/project/cogames-agents/' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist/

      - name: Check distributions
        run: pipx run twine check dist/*

      - name: Create deployment record
        id: create_deployment
        uses: actions/github-script@v7
        if: ${{ env.PUBLISH_TARGET == 'pypi' }}
        env:
          DEPLOY_DESCRIPTION: ${{ format('Publishing cogames-agents to {0}', env.PUBLISH_TARGET) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: process.env.DEPLOY_ENV,
              auto_merge: false,
              required_contexts: [],
              description: process.env.DEPLOY_DESCRIPTION,
              production_environment: process.env.PUBLISH_TARGET === 'pypi',
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: response.data.id,
              state: 'in_progress',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: process.env.DEPLOY_URL,
              description: 'Publishing in progress',
            });

            core.setOutput('deployment_id', response.data.id);
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.PUBLISH_TARGET == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: ${{ env.PUBLISH_TARGET == 'testpypi' }}
          verbose: true
      - name: Mark deployment successful
        if: ${{ env.PUBLISH_TARGET == 'pypi' && success() && steps.create_deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'success',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: process.env.DEPLOY_URL,
              description: 'Publish succeeded',
            });
      - name: Mark deployment failed
        if: ${{ env.PUBLISH_TARGET == 'pypi' && failure() && steps.create_deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'failure',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: process.env.DEPLOY_URL,
              description: 'Publish failed',
            });

  notify-discord:
    name: Notify Discord
    needs: [build-sdist, build-wheels, test, publish]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/notify-discord-status
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == cogames-agents-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#cogames-agents-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      - uses: ./.github/actions/notify-discord-status
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          package-name: cogames-agents
          version: ${{ steps.version.outputs.version }}
          success-message: "✅ **cogames-agents v${{ steps.version.outputs.version }}** published to [PyPI](https://pypi.org/project/cogames-agents/${{ steps.version.outputs.version }}/)"
          needs-context: ${{ toJSON(needs) }}
