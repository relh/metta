name: Build and publish cogames

on:
  push:
    tags:
      - cogames-v*
  workflow_dispatch:
    inputs:
      publish:
        description: "Enable publishing step"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      target:
        description: "Where to publish: testpypi (safe testing) or pypi (live release)"
        required: false
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build:
    name: Build distributions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build --outdir dist packages/cogames
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: cogames-dist
          path: dist/*

  wait-for-mettagrid:
    uses: ./.github/workflows/_wait-for-pypi.yml
    with:
      pyproject-path: packages/cogames/pyproject.toml
      dependency: mettagrid

  test:
    name: Smoke test cogames
    needs:
      # Instead of building the mettagrid wheel locally, which might differ from the version
      #  specified in cogames' pyproject.toml, we let mettagrid get automatically installed
      #  from PyPI. Hence we need to wait for it to be available on PyPI.
      - wait-for-mettagrid
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Metta-AI/cogames
          # For tag pushes: use the tag name (e.g., cogames-v1.2.3)
          # For manual dispatch: use main branch (since arbitrary branches aren't in child repo)
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify checked out ref
        run: |
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "Checked out: $(git describe --tags --always)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Without this, we get "ERROR: Could not install packages due to an OSError:
      #  [Errno 28] No space left on device" when trying to install cogames' dependencies.
      #  See https://github.com/Metta-AI/metta/actions/runs/20327783664/job/58396495857
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == cogames-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#cogames-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      - name: Install cogames with test dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install ".[test]"
      - name: Run tests
        run: |
          pytest tests/ -v --ignore=tests/docsync

  publish:
    name: Publish to PyPI
    needs:
      - build
      - test
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'yes' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ format('cogames-{0}', github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi') }}
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi' }}
      DEPLOY_ENV: ${{ format('cogames-{0}', github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi') }}
      DEPLOY_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/project/cogames/' || 'https://pypi.org/project/cogames/' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cogames-dist
          path: dist
      - name: List distributions
        run: ls -l dist
      - name: Create deployment record
        id: create_deployment
        uses: actions/github-script@v7
        if: ${{ env.PUBLISH_TARGET == 'pypi' }}
        env:
          DEPLOY_DESCRIPTION: ${{ format('Publishing cogames to {0}', env.PUBLISH_TARGET) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: process.env.DEPLOY_ENV,
              auto_merge: false,
              required_contexts: [],
              description: process.env.DEPLOY_DESCRIPTION,
              production_environment: process.env.PUBLISH_TARGET === 'pypi',
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: response.data.id,
              state: 'in_progress',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: process.env.DEPLOY_URL,
              description: 'Publishing in progress',
            });

            core.setOutput('deployment_id', response.data.id);
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.PUBLISH_TARGET == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: ${{ env.PUBLISH_TARGET == 'testpypi' }}
          verbose: true
      - name: Mark deployment successful
        if: ${{ env.PUBLISH_TARGET == 'pypi' && success() && steps.create_deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'success',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: process.env.DEPLOY_URL,
              description: 'Publish succeeded',
            });
      - name: Mark deployment failed
        if: ${{ env.PUBLISH_TARGET == 'pypi' && failure() && steps.create_deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'failure',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: process.env.DEPLOY_URL,
              description: 'Publish failed',
            });

  verify-pypi-install:
    name: Verify PyPI installation
    needs:
      - publish
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'yes' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      PUBLISH_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'pypi' }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Extract cogames version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/cogames-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#cogames-v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $VERSION"
          else
            echo "No version tag found, will install latest"
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Wait for cogames on PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ env.PUBLISH_TARGET }}" == "testpypi" ]; then
            PYPI_URL="https://test.pypi.org"
          else
            PYPI_URL="https://pypi.org"
          fi

          if [ -z "$VERSION" ]; then
            echo "No specific version to wait for, skipping wait"
            exit 0
          fi

          MAX_WAIT=1500  # 25 minutes
          CHECK_INTERVAL=30
          ELAPSED=0

          echo "Waiting for cogames==$VERSION to be available on $PYPI_URL..."

          while [ $ELAPSED -le $MAX_WAIT ]; do
            if curl -sf "$PYPI_URL/pypi/cogames/$VERSION/json" > /dev/null 2>&1; then
              echo "✓ cogames $VERSION is available on $PYPI_URL!"
              exit 0
            fi
            echo "⏳ Waiting... ($ELAPSED/$MAX_WAIT seconds elapsed)"
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
          done

          echo "❌ ERROR: cogames $VERSION not found on $PYPI_URL after $MAX_WAIT seconds"
          exit 1

      - name: Install and test cogames from PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Set up index URL for testpypi if needed
          if [ "${{ env.PUBLISH_TARGET }}" == "testpypi" ]; then
            INDEX_ARGS="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          else
            INDEX_ARGS=""
          fi

          # Install cogames from PyPI
          if [ -n "$VERSION" ]; then
            echo "Installing cogames==$VERSION from PyPI..."
            uv pip install $INDEX_ARGS "cogames==$VERSION" --system
          else
            echo "Installing latest cogames from PyPI..."
            uv pip install $INDEX_ARGS cogames --system
          fi

          # Smoke test 1: Check version command works
          echo ""
          echo "=== Testing cogames version ==="
          cogames version

          # Smoke test 2: Check missions list works (verifies mettagrid dependency)
          echo ""
          echo "=== Testing cogames missions ==="
          cogames missions

          echo ""
          echo "✓ cogames smoke tests passed!"
