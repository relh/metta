# Reusable workflow to build and deploy a Docker image to EKS using Helm
name: Build Image and Deploy with Helm

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel in-flight production deploys on main; cancelling can leave Helm in pending-* state.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_call:
    outputs:
      image_tag:
        description: "The image tag that was built and deployed"
        value: ${{ jobs.build-and-deploy.outputs.image_tag }}
    inputs:
      code_paths:
        description: "Comma-separated list of code paths to check for changes. Dockerfile and chart paths are automatically added."
        required: false
        type: string
        default: "- '**'"
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      tag_suffix:
        required: false
        type: string
        default: ""
      namespace:
        required: true
        type: string
      release:
        required: true
        type: string
      chart:
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: blacksmith-4vcpu-ubuntu-2404
      pre_deploy_command:
        required: false
        type: string
        default: ""
      docker_build_args:
        description: "Additional Docker build args to pass through to docker-build action."
        required: false
        type: string
        default: ""
      production_helm_values:
        description: "Additional Helm values for production deployment."
        required: false
        type: string
        default: ""
      preview_helm_values:
        description: "Additional Helm values for PR preview. If not provided, the preview will not be deployed."
        required: false
        type: string
        default: ""
      preview_host:
        required: false
        type: string
        default: ""

env:
  CI_APP_ID: ${{ secrets.CI_APP_ID }}
  CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

jobs:
  checks:
    name: "Filter for relevant changes"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      run: ${{ steps.filter.outputs.dockerfile == 'true' || steps.filter.outputs.chart == 'true' || steps.filter.outputs.paths == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3.0.2
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: |
            dockerfile:
              - '${{ inputs.dockerfile }}'
            chart:
              - '${{ inputs.chart }}/**'
            paths:
              ${{ inputs.code_paths }}

  build-and-deploy:
    name: "Build and Deploy"
    needs: checks
    if: |
      needs.checks.outputs.run == 'true' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ${{ inputs.runs_on }}
    # Build can take ~10-15m; leave enough headroom for helm --atomic --timeout 15m.
    # If the job times out first, Helm can be interrupted and left in pending-*.
    timeout-minutes: 45
    outputs:
      image_tag: ${{ steps.build-image.outputs.tag }}

    env:
      BUILD_PREVIEW: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && inputs.preview_helm_values != '' }}
      DELETE_PREVIEW: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}

    steps:
      - id: ci-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.CI_APP_ID }}
          private-key: ${{ env.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - name: Configure EKS
        if: github.ref == 'refs/heads/main' || env.BUILD_PREVIEW == 'true' || env.DELETE_PREVIEW == 'true'
        uses: ./.github/actions/eks-configure
        with:
          aws_role: ${{ vars.AWS_ROLE }}

      # useful for home deployment
      - name: Pre-deploy command
        if: inputs.pre_deploy_command != ''
        run: ${{ inputs.pre_deploy_command }}

      - name: Preflight production release lock check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: ./.github/actions/helm-preflight-lock-check
        with:
          namespace: ${{ inputs.namespace }}
          release: ${{ inputs.release }}

      - name: Build Docker image
        id: build-image
        uses: ./.github/actions/docker-build
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || env.BUILD_PREVIEW == 'true'
        with:
          image_name: ${{ inputs.image_name }}
          dockerfile: ${{ inputs.dockerfile }}
          suffix: ${{ inputs.tag_suffix }}
          aws_role: ${{ vars.AWS_ROLE }}
          build_args: ${{ inputs.docker_build_args }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          helm upgrade -i \
            --atomic --timeout 15m \
            -n ${{ inputs.namespace }} \
            ${{ inputs.release }} \
            ${{ inputs.chart }} \
            --set image.tag=${{ steps.build-image.outputs.tag }} \
            ${{ inputs.production_helm_values }}

      - name: Deploy PR preview
        if: env.BUILD_PREVIEW == 'true'
        run: |
          helm upgrade -i \
            --atomic --timeout 10m \
            -n ${{ inputs.namespace }} \
            ${{ inputs.release }}-pr-${{ github.event.pull_request.number }} \
            ${{ inputs.chart }} \
            --set image.tag=${{ steps.build-image.outputs.tag }} \
            --labels pr-preview=true,pr-number=${{ github.event.pull_request.number }} \
            ${{ inputs.preview_helm_values }}

      - name: Determine release name for diagnostics
        id: diag-release
        if: failure() && (github.ref == 'refs/heads/main' || env.BUILD_PREVIEW == 'true')
        shell: bash
        run: |
          if [[ "$BUILD_PREVIEW" == "true" ]]; then
            echo "name=${{ inputs.release }}-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect deploy failure diagnostics
        if: failure() && (github.ref == 'refs/heads/main' || env.BUILD_PREVIEW == 'true')
        uses: ./.github/actions/deploy-failure-diagnostics
        with:
          namespace: ${{ inputs.namespace }}
          release: ${{ steps.diag-release.outputs.name }}

      - name: Comment PR with preview URL
        if: env.BUILD_PREVIEW == 'true' && inputs.preview_host != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ inputs.preview_host }}`;
            const body = `🚀 Preview deployment is ready!\n\n**URL:** ${url}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Preview deployment is ready') &&
                comment.body.includes(url)
            );

            if (botComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: body
                });
            } else {
                // Create new comment
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: body
                });
            }

      - name: Delete PR preview
        if: env.DELETE_PREVIEW == 'true'
        run: helm delete --ignore-not-found -n ${{ inputs.namespace }} ${{ inputs.release }}-pr-${{ github.event.pull_request.number }}
