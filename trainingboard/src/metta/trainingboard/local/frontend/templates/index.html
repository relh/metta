<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trainingboard flywheel dashboard</title>
    <style>
      :root {
        --bg: #040a13;
        --bg-panel: rgba(11, 21, 34, 0.93);
        --bg-soft: rgba(7, 14, 23, 0.88);
        --line: #31537a;
        --line-soft: #20374f;
        --text: #eef6ff;
        --muted: #a8bfd7;
        --focus: #6af0bd;
        --focus-2: #6ec4ff;
        --focus-3: #ffc46a;
        --danger: #ff9aac;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--text);
        background:
          radial-gradient(1300px 840px at 0% -25%, #154367 0%, transparent 68%),
          radial-gradient(960px 720px at 100% -5%, #365982 0%, transparent 61%),
          linear-gradient(180deg, #071220, var(--bg));
        font-family: "Sora", "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      }
      main {
        width: min(1880px, 97vw);
        margin: 14px auto 22px;
      }
      .hero {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--bg-panel);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(22px, 1.7vw, 32px);
        line-height: 1;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .hero-line {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: thin;
      }
      .hero-desc {
        color: var(--muted);
        font-size: clamp(12px, 0.9vw, 15px);
        padding-right: 4px;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(20, 36, 54, 0.95), rgba(13, 27, 43, 0.95));
        padding: 5px 8px;
        font-size: clamp(11px, 0.85vw, 14px);
      }
      .pill strong {
        color: var(--focus);
      }
      .pill-accent {
        border-color: #4f7aa8;
        color: #d6ebff;
      }
      .status-inline {
        color: var(--muted);
        font-size: clamp(11px, 0.82vw, 14px);
        padding-left: 4px;
      }
      .status-inline.error {
        color: var(--danger);
      }
      .top-bets {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--bg-panel);
        padding: 14px;
      }
      .top-bets h2 {
        margin: 0;
        font-size: clamp(22px, 1.8vw, 34px);
        letter-spacing: 0.01em;
      }
      .bet-grid {
        margin-top: 10px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(240px, 1fr));
      }
      .bet-column {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(14, 28, 45, 0.95), rgba(8, 18, 29, 0.95));
        padding: 10px;
      }
      .bet-column.now {
        border-color: #3a9f77;
      }
      .bet-column.next {
        border-color: #3d78b4;
      }
      .bet-column.later {
        border-color: #8f6d42;
      }
      .bet-column h3 {
        margin: 0 0 8px;
        font-size: clamp(16px, 1.2vw, 22px);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .bet-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }
      .bet-list li {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: rgba(7, 14, 23, 0.95);
        padding: 8px;
      }
      .bet-axis {
        color: var(--focus-2);
        font-size: clamp(12px, 0.9vw, 16px);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .bet-title {
        margin-top: 4px;
        font-weight: 700;
        font-size: clamp(14px, 1.04vw, 18px);
      }
      .bet-title a {
        color: inherit;
        text-decoration: none;
      }
      .bet-title a:hover,
      .bet-title a:focus-visible {
        color: var(--focus);
        text-decoration: underline;
      }
      .bet-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: clamp(12px, 0.9vw, 15px);
      }
      .grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(3, minmax(320px, 1fr));
        gap: 10px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--bg-panel);
        padding: 11px;
        min-height: 228px;
      }
      .panel h2 {
        margin: 0;
        font-size: clamp(17px, 1.22vw, 24px);
        line-height: 1;
      }
      .panel-title-line {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .panel-tagline {
        color: var(--muted);
        font-size: clamp(11px, 0.82vw, 14px);
        letter-spacing: 0.01em;
      }
      .metric-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .metric {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: var(--bg-soft);
        padding: 5px 8px;
        font-size: clamp(11px, 0.85vw, 14px);
      }
      .metric strong {
        color: var(--focus);
      }
      .evidence-inline {
        margin-top: 8px;
        color: var(--muted);
        font-size: clamp(11px, 0.82vw, 14px);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
      }
      .evidence-label {
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .evidence-chip {
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        background: rgba(8, 16, 25, 0.86);
        padding: 3px 7px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wins {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 5px;
      }
      .evidence-empty {
        margin-top: 8px;
        color: var(--muted);
        font-size: clamp(11px, 0.82vw, 14px);
      }
      .wins li {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: rgba(7, 14, 23, 0.9);
        padding: 6px 7px;
        font-size: clamp(11px, 0.85vw, 14px);
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        line-height: 1.25;
      }
      .wins .label {
        font-weight: 700;
      }
      .wins .mult {
        color: var(--focus);
        font-weight: 700;
      }
      .wins .meta {
        color: var(--muted);
        flex: 1 1 240px;
      }
      @media (max-width: 1380px) {
        .hero {
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .hero-line {
          white-space: normal;
          overflow-x: visible;
          flex-wrap: wrap;
        }
        .bet-grid {
          grid-template-columns: repeat(2, minmax(240px, 1fr));
        }
        .grid {
          grid-template-columns: repeat(2, minmax(260px, 1fr));
        }
      }
      @media (max-width: 880px) {
        .bet-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 760px) {
        main {
          width: min(98vw, 98vw);
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Training Flywheel Board</h1>
        <div class="hero-line">
          <span class="hero-desc">
            Six-axis map for faster training loops, ranked by priors and ingested Asana evidence.
          </span>
          <span class="pill" id="combinedMultiplier">combined <strong>x0.00</strong></span>
          <span class="pill" id="generatedAt">generated: -</span>
          <span class="pill pill-accent">board mode: auto-refresh every 45s</span>
          <span class="status-inline" id="status">Loading dashboard...</span>
        </div>
      </section>

      <section class="top-bets">
        <h2>Top Bets: Now / Next / Later</h2>
        <div class="bet-grid" id="topBetsBuckets"></div>
      </section>

      <section class="grid" id="axisPanels"></section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
