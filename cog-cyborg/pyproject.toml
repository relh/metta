[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cog-cyborg"
version = "0.1.0"
description = "Hybrid in-cog runtime for Mettagrid policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["anthropic[bedrock]>=0.64.0", "mettagrid-sdk", "pydantic>=2.12.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cog_cyborg", "cog_cyborg.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cog_cyborg = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cog_cyborg"]

[tool.uv.sources]
mettagrid-sdk = { workspace = true }
