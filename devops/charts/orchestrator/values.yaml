replicaCount: 1

image:
  registry: 751442549699.dkr.ecr.us-east-1.amazonaws.com
  name: metta-app-backend
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::751442549699:role/orchestrator-eval-worker

env:
  BACKEND_URL: "https://api.observatory.softmax-research.net"
  DD_TRACE_ENABLED: "true"

secrets:
  wandb: "wandb-api-secret"
  machineToken: "machine-token-secret"

# Datadog agent is deployed as a separate service
# This controls how the orchestrator connects to Datadog
datadog:
  enabled: true
  env: "production"

watcher:
  enabled: true
  imageTag: ""
  dbSecret: "observatory-backend-env"
  evalClusterRoleArn: "arn:aws:iam::583928386201:role/PrimaryAccountEKSAccess"
  evalClusterName: "tournament"
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
      ephemeral-storage: 10Gi
    limits:
      cpu: 200m
      memory: 1Gi

tournament:
  enabled: true
  dbSecret: "observatory-backend-env"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: 1000m
      memory: 4Gi

eventProcessor:
  enabled: true
  dbSecret: "observatory-backend-env"
  evalClusterRoleArn: "arn:aws:iam::583928386201:role/PrimaryAccountEKSAccess"
  evalClusterName: "tournament"
  evalS3Bucket: "observatory-private"
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
      ephemeral-storage: 10Gi
    limits:
      cpu: 200m
      memory: 1Gi
