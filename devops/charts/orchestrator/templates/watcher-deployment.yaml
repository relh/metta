{{- if .Values.watcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-watcher
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-watcher
    spec:
      serviceAccountName: {{ include "orchestrator.serviceAccountName" . }}
      containers:
      - name: watcher
        image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.name }}:{{ .Values.watcher.imageTag | default (required "tag is required" .Values.image.tag) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uv", "run", "--no-sync", "python", "-m", "metta.app_backend.job_runner.watcher"]
        ports:
        - containerPort: 8080
          name: health
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 24
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        {{- if .Values.watcher.dbSecret }}
        - name: STATS_DB_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.watcher.dbSecret }}
              key: STATS_DB_URI
        {{- end }}
        {{- include "orchestrator.otelEnv" (dict "Values" .Values "serviceVersion" .Values.watcher.imageTag) | nindent 8 }}
        - name: EVAL_CLUSTER_ROLE_ARN
          value: {{ .Values.watcher.evalClusterRoleArn | quote }}
        - name: EVAL_CLUSTER_NAME
          value: {{ .Values.watcher.evalClusterName | quote }}
        - name: EVAL_S3_BUCKET
          value: {{ .Values.watcher.evalS3Bucket | quote }}
        resources:
          {{- toYaml .Values.watcher.resources | nindent 10 }}
{{- end }}
