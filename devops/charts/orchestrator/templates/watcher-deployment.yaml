{{- if .Values.watcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-watcher
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-watcher
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.datadog.enabled }}
    tags.datadoghq.com/env: {{ .Values.datadog.env | quote }}
    tags.datadoghq.com/service: "job-watcher"
    tags.datadoghq.com/version: {{ .Values.watcher.imageTag | default .Values.image.tag | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-watcher
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ .Values.datadog.env | quote }}
        tags.datadoghq.com/service: "job-watcher"
        tags.datadoghq.com/version: {{ .Values.watcher.imageTag | default .Values.image.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "orchestrator.serviceAccountName" . }}
      containers:
      - name: watcher
        image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.name }}:{{ .Values.watcher.imageTag | default (required "tag is required" .Values.image.tag) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uv", "run", "--no-sync", "python", "-m", "metta.app_backend.job_runner.watcher"]
        ports:
        - containerPort: 8080
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        {{- if .Values.watcher.dbSecret }}
        - name: STATS_DB_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.watcher.dbSecret }}
              key: STATS_DB_URI
        {{- end }}
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_ENABLED
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: "episode-job-watcher"
        - name: EVAL_CLUSTER_ROLE_ARN
          value: {{ .Values.watcher.evalClusterRoleArn | quote }}
        - name: EVAL_CLUSTER_NAME
          value: {{ .Values.watcher.evalClusterName | quote }}
        - name: EVAL_S3_BUCKET
          value: {{ .Values.watcher.evalS3Bucket | quote }}
        resources:
          {{- toYaml .Values.watcher.resources | nindent 10 }}
{{- end }}
