{{- if .Values.eventProcessor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-event-processor
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-event-processor
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- if .Values.datadog.enabled }}
    tags.datadoghq.com/env: {{ .Values.datadog.env | quote }}
    tags.datadoghq.com/service: "k8s-event-processor"
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-event-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-event-processor
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ .Values.datadog.env | quote }}
        tags.datadoghq.com/service: "k8s-event-processor"
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "orchestrator.serviceAccountName" . }}
      initContainers:
      - name: wait-for-backend
        image: curlimages/curl:8.5.0
        command: ['sh', '-c', 'until curl -sf {{ .Values.env.BACKEND_URL }}/whoami; do echo "Waiting for backend..."; sleep 5; done']
      containers:
      - name: event-processor
        image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uv", "run", "--no-sync", "python", "-m", "metta.app_backend.job_runner.event_processor"]
        ports:
        - containerPort: 8080
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: STATS_SERVER_URI
          value: {{ .Values.env.BACKEND_URL | quote }}
        - name: MACHINE_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.machineToken }}
              key: token
        {{- if .Values.eventProcessor.dbSecret }}
        - name: STATS_DB_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.eventProcessor.dbSecret }}
              key: STATS_DB_URI
        {{- end }}
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_TRACES_ENABLED
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: "k8s-event-processor"
        - name: EVAL_CLUSTER_ROLE_ARN
          value: {{ .Values.eventProcessor.evalClusterRoleArn | quote }}
        - name: EVAL_CLUSTER_NAME
          value: {{ .Values.eventProcessor.evalClusterName | quote }}
        - name: EVAL_S3_BUCKET
          value: {{ .Values.eventProcessor.evalS3Bucket | quote }}
        resources:
          {{- toYaml .Values.eventProcessor.resources | nindent 10 }}
{{- end }}
