apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.datadog.enabled }}
  labels:
    tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
    tags.datadoghq.com/service: "policy-dashboard-frontend"
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
        tags.datadoghq.com/service: "policy-dashboard-frontend"
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
          imagePullPolicy: Always
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          - name: NEXT_PUBLIC_DASHBOARD_API_BASE_URL
            value: "{{ .Values.apiUrl }}"
          - name: BARDO_WORLD_STATE_URL
            value: "{{ .Values.bardoWorldStateUrl }}"
          - name: OBSERVATORY_AUTH_COOKIE_NAME
            value: "{{ .Values.observatoryAuthCookieName }}"
          - name: NEXT_PUBLIC_OBSERVATORY_AUTH_COOKIE_NAME
            value: "{{ .Values.observatoryAuthCookieName }}"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
