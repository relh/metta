host: vibeservatory.softmax-research.net

apiUrl: https://api.vibeservatory.softmax-research.net
bardoWorldStateUrl: https://api.vibeservatory.softmax-research.net/bardo/v1/world-state
observatoryAuthCookieName: observatory_auth_token

image:
  registry: 751442549699.dkr.ecr.us-east-1.amazonaws.com
  name: metta-app-frontend
  tag: "" # will be set by CI/CD pipeline

cert_manager_issuer: letsencrypt

replicaCount: 2

resources:
  requests:
    cpu: 1000m
    memory: 256Mi
    ephemeral-storage: 2Gi
  limits:
    cpu: 2000m
    memory: 1Gi

datadog:
  enabled: true
  env: production # overridden by CI/CD pipeline as needed
