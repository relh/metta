apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.datadog }}
  labels:
    tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
    tags.datadoghq.com/service: "policy-dashboard-backend"
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- if .Values.datadog }}
        tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
        tags.datadoghq.com/service: "policy-dashboard-backend"
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: server
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
          imagePullPolicy: Always
          command: ["uv", "run", "--no-sync", "python", "-m", "dashboard.backend.dashboard_backend.main"]
          workingDir: /workspace/metta
          envFrom:
          - secretRef:
              name: {{ .Values.secret_name }}
          env:
          - name: DASHBOARD_CORS_ORIGINS
            value: "https://{{ .Values.frontendHost | required "frontendHost is required" }}"
          {{- if .Values.env }}
          {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "4Gi"
          ports:
            - containerPort: 8010
          startupProbe:
            httpGet:
              path: /healthz
              port: 8010
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8010
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8010
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
