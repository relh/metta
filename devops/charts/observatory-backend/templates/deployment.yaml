apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: {{ .Release.Name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
          # Tags are immutable commit SHAs in this deployment flow.
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-sync", "python", "src/metta/app_backend/server.py"]
          workingDir: /workspace/metta/app_backend
          envFrom:
          - secretRef:
              name: {{ .Values.secret_name }}
          env:
          - name: EPISODE_RUNNER_IMAGE
            value: "{{ .Values.episodeRunnerImage.registry }}/{{ .Values.episodeRunnerImage.name }}:{{ .Values.episodeRunnerImage.tag }}"
          - name: HOST
            value: "0.0.0.0"
          - name: PORT
            value: "8000"
          - name: STATS_SERVER_URI
            value: "https://{{ .Values.host }}"
          {{- include "observatory-backend.otelEnv" . | nindent 10 }}
          {{- if .Values.env }}
          {{- range $key, $value := .Values.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.secrets.machineToken }}
          - name: MACHINE_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.machineToken }}
                key: token
          {{- end }}
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "10Gi"
            limits:
              memory: "4Gi"
              ephemeral-storage: "10Gi"
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /whoami
              port: 8000
            periodSeconds: 5
            failureThreshold: 60 # allow up to 60*5 seconds = 5 minutes (accounting for uv sync)
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /whoami
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /whoami
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
