apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-db-migrate"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}-db-migrate"
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
          imagePullPolicy: Always
          command: ["uv", "run", "--no-sync", "alembic", "-c", "alembic.ini", "upgrade", "head"]
          workingDir: /workspace/metta/app_backend
          envFrom:
          - secretRef:
              name: {{ .Values.secret_name }}
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
