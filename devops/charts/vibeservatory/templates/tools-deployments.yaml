          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.trainboard.port }}
          periodSeconds: 5
          failureThreshold: 2
          timeoutSeconds: 3
{{- end }}
