{{- if .Values.chatprop.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chatprop
  {{- if .Values.datadog.enabled }}
  labels:
    tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
    tags.datadoghq.com/service: "chatprop"
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.chatprop.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-chatprop
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-chatprop
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
        tags.datadoghq.com/service: "chatprop"
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      containers:
      - name: chatprop
        image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        command:
        - uv
        - run
        - --project
        - /workspace/metta/chatprop
        - chatprop
        - serve
        - --host
        - 0.0.0.0
        - --port
        - {{ .Values.chatprop.port | quote }}
        workingDir: /workspace/metta
        env:
        - name: HOME
          value: {{ .Values.chatprop.homeDir | quote }}
        resources:
          {{- toYaml .Values.chatprop.resources | nindent 10 }}
        ports:
        - containerPort: {{ .Values.chatprop.port }}
          name: http
        startupProbe:
          httpGet:
            path: /
            port: {{ .Values.chatprop.port }}
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.chatprop.port }}
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.chatprop.port }}
          periodSeconds: 5
          failureThreshold: 2
          timeoutSeconds: 3
---
{{- end }}
{{- if .Values.trainboard.enabled }}
