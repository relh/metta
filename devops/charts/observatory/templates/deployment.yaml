apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.datadog.enabled }}
  labels:
    tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
    tags.datadoghq.com/service: "observatory-frontend"
    tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- if .Values.datadog.enabled }}
        tags.datadoghq.com/env: {{ required "datadog.env is required" .Values.datadog.env | quote }}
        tags.datadoghq.com/service: "observatory-frontend"
        tags.datadoghq.com/version: {{ .Values.image.tag | quote }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ required "tag is required" .Values.image.tag }}"
          imagePullPolicy: Always
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          - name: OBSERVATORY_API_URL
            value: "{{ .Values.apiUrl }}"
          - name: OBSERVATORY_POLICY_DASHBOARD_URL
            value: "{{ .Values.policyDashboardUrl }}"
          - name: SITE_URL
            value: "https://{{ .Values.host }}"
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: /auth/login
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
