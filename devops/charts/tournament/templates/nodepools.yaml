{{- range .Values.pools }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .name }}
spec:
{{- if .replicas }}
  replicas: {{ .replicas }}
{{- end }}
{{- if .weight }}
  weight: {{ .weight }}
{{- end }}
  disruption:
    budgets:
    - nodes: 100%
    consolidateAfter: 30s
    consolidationPolicy: WhenEmpty
  template:
    metadata:
      labels:
        workload-type: {{ .workload }}
    spec:
      expireAfter: 336h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default

      requirements:
      {{- range .requirements }}
      - key: {{ .key }}
        operator: {{ .operator }}
        values:
        {{- range .values }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}

      - key: eks.amazonaws.com/instance-generation
        operator: Gt
        values: ["4"]

      - key: eks.amazonaws.com/instance-category
        operator: In
        values: ["c", "m", "r"]

      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]

      - key: kubernetes.io/os
        operator: In
        values: ["linux"]

      taints:
      - effect: NoSchedule
        key: workload-type
        value: {{ .workload }}
{{- end }}
