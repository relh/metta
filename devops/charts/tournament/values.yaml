pools:
  - name: jobs-warm
    workload: jobs
    replicas: 2
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]

      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["r6a.2xlarge"]

  - name: jobs
    workload: jobs
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]

      - key: eks.amazonaws.com/instance-cpu
        operator: In
        values: ["4", "8", "12", "16"]

      - key: eks.amazonaws.com/instance-memory
        operator: Gt
        values: ["16384"]
