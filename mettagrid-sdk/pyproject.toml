[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mettagrid-sdk"
version = "0.1.0"
description = "Semantic SDK for Mettagrid games"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mettagrid", "pydantic>=2.12.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mettagrid_sdk", "mettagrid_sdk.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mettagrid_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mettagrid_sdk"]

[tool.uv.sources]
mettagrid = { workspace = true }
