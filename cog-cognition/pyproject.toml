[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cog-cognition"
version = "0.1.0"
description = "Optional cognition layers for Mettagrid policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cog-cyborg", "cogames", "mettagrid", "mettagrid-sdk", "pydantic>=2.12.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cog_cognition", "cog_cognition.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cog_cognition = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cog_cognition"]

[tool.uv.sources]
cog-cyborg = { workspace = true }
cogames = { workspace = true }
mettagrid = { workspace = true }
mettagrid-sdk = { workspace = true }
